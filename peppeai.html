<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Peppe AI | AI Ufficiale® </title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        /* =========================================
           1. CORE & VARIABLES
           ========================================= */
        :root {
            --bg-base: #09090b;
            --bg-surface: #18181b;
            --bg-surface-hover: #27272a;
            /* Modifica questi colori per cambiare il tema principale (scritta AI, pallini, icone) */
            --primary: #0ea5e9; 
            --primary-glow: rgba(14, 165, 233, 0.4);
            --primary-glow-strong: #0ea5e9cc;
            --border-glow: 0 0 12px rgba(14, 165, 233, 0.25);
            --border-active: #0ea5e9;
            
            --text-100: #fafafa;
            --text-200: #a1a1aa;
            --border: #27272a;
            --user-bubble: #18181b;
            --ai-bubble: transparent;
            --ease-spring: cubic-bezier(0.175, 0.885, 0.32, 1.1);
            --ease-smooth: cubic-bezier(0.4, 0, 0.2, 1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

        body {
            background-color: var(--bg-base); color: var(--text-100);
            font-family: 'Inter', sans-serif;
            height: 100vh; height: 100dvh;
            display: flex; overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* =========================================
           2. SIDEBAR 
           ========================================= */
        .sidebar {
            width: 300px; min-width: 300px;
            background-color: var(--bg-base); 
            border-right: 1px solid var(--border-active);
            box-shadow: var(--border-glow);
            display: flex; flex-direction: column; padding: 1.2rem;
            transition: all 0.4s var(--ease-smooth); z-index: 100;
            overflow: hidden;
        }

        .sidebar.collapsed { width: 0; min-width: 0; padding-left: 0; padding-right: 0; border: none; opacity: 0; box-shadow: none; }

        @media (max-width: 768px) {
            .sidebar {
                position: fixed; left: 0; top: 0; height: 100%;
                transform: translateX(-100%); width: 280px; min-width: 280px;
                background-color: rgba(9, 9, 11, 0.95); backdrop-filter: blur(20px);
                box-shadow: 20px 0 50px rgba(0,0,0,0.5), var(--border-glow); opacity: 1; 
                border-right: 1px solid var(--border-active);
            }
            .sidebar.active { transform: translateX(0); }
            .sidebar.collapsed { width: 280px; min-width: 280px; } 
            
            /* FIX MOBILE: Mostra sempre le azioni (Rinomina/Elimina) nello storico su mobile */
            .history-actions { display: flex !important; }
        }

        .sidebar-top-actions {
            display: flex; gap: 8px; width: 100%;
        }

        .new-chat-btn {
            background: var(--bg-surface); color: var(--text-100); border: 1px solid var(--border);
            padding: 1rem; border-radius: 14px; flex: 1;
            cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 0.5rem;
            font-weight: 600; font-size: 0.95rem; transition: all 0.3s var(--ease-smooth);
        }
        .new-chat-btn:hover { 
            background: var(--bg-surface-hover); border-color: var(--primary); 
            box-shadow: inset 0 0 15px var(--primary-glow); transform: translateY(-2px);
        }

        .temp-chat-btn {
            background: var(--bg-surface); border: 1px solid var(--border); color: var(--text-200);
            padding: 0 1rem; border-radius: 14px; cursor: pointer; transition: 0.3s;
            display: flex; align-items: center; justify-content: center;
        }
        .temp-chat-btn:hover { background: rgba(255, 255, 255, 0.1); color: #0ea5e9; border-color: #0ea5e9; }
        .temp-chat-btn.active { background: rgba(255, 255, 255, 0.2); color: #0ea5e9; border-color: #0ea5e9; box-shadow: 0 0 10px rgba(255, 255, 255, 0.3); }

        .history-title {
            font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1px;
            color: var(--text-200); font-weight: 600; margin-top: 1.5rem; margin-bottom: 0.5rem;
            padding: 0 0.5rem; opacity: 0.7;
        }

        .history-list {
            flex: 1; overflow-y: auto;
            display: flex; flex-direction: column; gap: 0.4rem; width: 100%;
        }
        .history-list::-webkit-scrollbar { width: 4px; }
        .history-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
        
        .history-item {
            padding: 0.8rem 1rem; color: var(--text-200); cursor: pointer;
            border-radius: 10px; font-size: 0.9rem; display: flex; align-items: center; justify-content: space-between;
            border: 1px solid transparent; transition: 0.2s;
        }
        .history-item-content {
            display: flex; align-items: center; gap: 0.8rem; flex: 1; overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
        }
        .history-item:hover, .history-item.active { 
            background-color: var(--bg-surface); color: var(--text-100); 
            border-color: var(--primary-glow);
            box-shadow: inset 0 0 10px var(--primary-glow);
        }

        .history-actions {
            display: none; align-items: center; gap: 6px;
        }
        .history-item:hover .history-actions { display: flex; }
        .action-btn {
            background: transparent; border: none; color: var(--text-200); cursor: pointer;
            padding: 4px; border-radius: 4px; display: flex; align-items: center; justify-content: center;
        }
        .action-btn:hover { color: var(--text-100); background: rgba(255,255,255,0.1); }
        .action-btn.delete:hover { color: #ffffff; background: rgba(239, 68, 68, 0.1); }

        .empty-history { text-align: center; color: var(--text-200); font-size: 0.85rem; margin-top: 1rem; opacity: 0.5; }

        /* =========================================
           3. MAIN AREA & HEADER
           ========================================= */
        .main-content { flex: 1; display: flex; flex-direction: column; position: relative; transition: all 0.4s; min-width: 0; }

        .header {
            height: 64px; display: flex; align-items: center; justify-content: space-between;
            padding: 0 1.5rem; position: absolute; top: 0; width: 100%;
            background: linear-gradient(to bottom, rgba(9,9,11,1) 0%, rgba(9,9,11,0) 100%);
            z-index: 50; pointer-events: none;
        }
        .header-content { pointer-events: auto; display: flex; align-items: center; gap: 1rem; }
        
        .brand-container { display: flex; align-items: center; gap: 10px; }
        .brand-icon {
            width: 28px; height: 28px; background: var(--bg-surface);
            border-radius: 8px; display: flex; align-items: center; justify-content: center;
            border: 1px solid var(--primary); box-shadow: 0 0 10px var(--primary-glow);
            color: var(--primary);
        }
        .brand { font-size: 1.2rem; font-weight: 800; letter-spacing: 0.5px; text-transform: uppercase; }
        .brand span { color: var(--primary); text-shadow: 0 0 8px var(--primary), 0 0 20px var(--primary-glow-strong); }

        .menu-btn {
            background: var(--bg-surface); border: 1px solid var(--border-active); border-radius: 8px;
            color: var(--text-100); cursor: pointer; display: flex; align-items: center; justify-content: center;
            padding: 8px; transition: 0.2s; pointer-events: auto; box-shadow: var(--border-glow);
        }
        .menu-btn:hover { background: var(--bg-surface-hover); border-color: var(--primary); box-shadow: 0 0 15px var(--primary-glow); }

        .temp-badge {
            pointer-events: auto;
            display: flex; align-items: center; gap: 6px;
            background: rgba(68, 191, 239, 0.1); color: #ffffff;
            border: 1px solid #0ea5e9;
            padding: 6px 14px; border-radius: 20px;
            font-size: 0.8rem; font-weight: 600;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
            animation: fadeIn 0.3s ease;
        }

        /* =========================================
           4. CHAT INTERFACE & ZERO STATE
           ========================================= */
        .chat-container {
            flex: 1; overflow-y: auto; padding: 5rem 15% 2rem 15%;
            display: flex; flex-direction: column; gap: 2rem; scroll-behavior: smooth;
        }
        @media (max-width: 1024px) { .chat-container { padding: 5rem 2rem 2rem 2rem; } }
        @media (max-width: 768px) { .chat-container { padding: 4rem 1rem 2rem 1rem; gap: 1.5rem; } }

        .welcome-screen {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            height: 100%; text-align: center; animation: fadeIn 0.5s ease;
        }
        .welcome-screen h1 { font-size: 2.5rem; margin-bottom: 0.5rem; font-weight: 700;}
        .welcome-screen h1 span { color: var(--primary); text-shadow: 0 0 15px var(--primary-glow-strong); }
        
        .suggestions { display: flex; gap: 1rem; flex-wrap: wrap; justify-content: center; margin-top: 2rem; }
        .suggestion-chip {
            background: var(--bg-surface); border: 1px solid var(--primary-glow); padding: 0.8rem 1.2rem;
            border-radius: 20px; font-size: 0.9rem; color: var(--text-200); cursor: pointer; transition: 0.2s;
            box-shadow: var(--border-glow);
        }
        .suggestion-chip:hover { background: var(--bg-surface-hover); color: var(--primary); border-color: var(--primary); box-shadow: 0 0 15px var(--primary-glow); }

        .message { display: flex; gap: 1.2rem; width: 100%; animation: slideUp 0.4s var(--ease-spring) forwards; opacity: 0; transform: translateY(20px); }
        .message.user { flex-direction: row-reverse; }
        .avatar { width: 32px; height: 32px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-weight: 700; flex-shrink: 0; box-shadow: var(--border-glow); border: 1px solid var(--primary); }
        .ai .avatar { background: var(--primary); color: white; }
        .user .avatar { display: none; }
        
        .message-content { line-height: 1.6; font-size: 1rem; width: fit-content; max-width: 85%; }
        
        .user .message-content { 
            background-color: var(--user-bubble); padding: 0.8rem 1.2rem; 
            border-radius: 18px; border-bottom-right-radius: 4px; 
            border: 1px solid var(--border-active); 
            color: var(--border-active);
            box-shadow: 0 0 15px var(--primary-glow);
        }
        .ai .message-content { padding: 0.2rem 0; color: var(--text-100); width: 100%; }

        /* =========================================
           5. INPUT AREA
           ========================================= */
        .input-area { padding: 0 15% 2rem 15%; position: relative; }
        @media (max-width: 1024px) { .input-area { padding: 0 2rem 2rem 2rem; } }
        @media (max-width: 768px) { .input-area { padding: 0 1rem 1rem 1rem; } }

        .input-wrapper-outer {
            position: relative;
            padding: 2px;
            border-radius: 26px;
            background: var(--bg-surface);
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        /* Effetto Linea Animata: Modifica l'ultimo colore (#10b981) per cambiare la sfumatura finale */
        .input-wrapper-outer::before {
            content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
            background: conic-gradient(from 0deg, transparent 70%, var(--primary) 80%, #10b981 100%);
            animation: rotateGlow 3s linear infinite; z-index: 0;
        }

        @keyframes rotateGlow { 100% { transform: rotate(360deg); } }

        .input-wrapper {
            position: relative; background-color: var(--bg-surface); border-radius: 24px;
            padding: 0.5rem; display: flex; align-items: flex-end; gap: 0.5rem; z-index: 1;
            border: 1px solid var(--border-active);
        }

        .icon-btn {
            background: transparent; border: none; color: var(--text-200); width: 38px; height: 38px;
            display: flex; align-items: center; justify-content: center; border-radius: 50%;
            cursor: pointer; transition: 0.2s; flex-shrink: 0; margin-bottom: 2px; z-index: 2;
        }
        .icon-btn:hover { background: var(--bg-surface-hover); color: var(--primary); }
        
        .mic-active { color: #851f6f !important; animation: pulseRed 1.5s infinite; }
        @keyframes pulseRed { 0% { box-shadow: 0 0 0 0 rgba(255, 255, 255, 0.4); } 70% { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); } 100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); } }

        #userInput {
            flex: 1; background: transparent; border: none; 
            color: var(--border-active); 
            font-size: 1.05rem; font-family: inherit; resize: none; font-weight: 500;
            height: auto; min-height: 28px; max-height: 150px; overflow-y: auto; 
            line-height: 1.5; outline: none; padding: 8px 0; margin: 0 5px;
            align-self: center; z-index: 2;
        }
        #userInput::placeholder { color: var(--text-200); font-weight: 400; }

        .send-btn {
            background-color: var(--text-100); color: var(--bg-base); border: none; border-radius: 18px;
            width: 38px; height: 38px; display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: 0.2s; flex-shrink: 0; margin-bottom: 2px; z-index: 2;
        }
        .send-btn:hover:not(:disabled) { background-color: var(--primary); color: white; transform: scale(1.05); box-shadow: 0 0 15px var(--primary-glow); }
        .send-btn:disabled { opacity: 0.3; cursor: not-allowed; }

        /* =========================================
           6. CUSTOM MODALS (Popup Rinomina/Elimina)
           ========================================= */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.8); z-index: 3000; backdrop-filter: blur(5px);
            display: flex; align-items: center; justify-content: center;
            opacity: 0; pointer-events: none; transition: 0.3s;
        }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }
        
        .modal-box {
            background: var(--bg-surface); padding: 2rem; border-radius: 20px;
            border: 1px solid var(--border-active); box-shadow: 0 0 30px var(--primary-glow);
            width: 90%; max-width: 400px; transform: translateY(20px); transition: 0.3s;
        }
        .modal-overlay.active .modal-box { transform: translateY(0); }
        
        .modal-box h3 { margin-bottom: 1rem; color: var(--text-100); font-size: 1.3rem; }
        .modal-box p { color: var(--text-200); margin-bottom: 1.5rem; font-size: 0.95rem; line-height: 1.5; }
        .modal-box input {
            width: 100%; padding: 12px 15px; border-radius: 12px; margin-bottom: 1.5rem;
            background: var(--bg-base); border: 1px solid var(--border);
            color: var(--primary); font-family: inherit; font-size: 1rem; outline: none;
        }
        .modal-box input:focus { border-color: var(--primary); box-shadow: 0 0 10px var(--primary-glow); }
        
        .modal-actions { display: flex; justify-content: flex-end; gap: 10px; }
        .modal-btn { padding: 10px 20px; border-radius: 10px; border: none; font-weight: 600; cursor: pointer; transition: 0.2s; font-family: inherit;}
        .modal-btn.cancel { background: var(--bg-base); color: var(--text-100); border: 1px solid var(--border); }
        .modal-btn.cancel:hover { background: var(--border); }
        .modal-btn.confirm { background: var(--primary); color: white; }
        .modal-btn.confirm:hover { box-shadow: 0 0 15px var(--primary-glow); transform: scale(1.05); }

        /* =========================================
           7. ANIMAZIONI MISTE
           ========================================= */
        @keyframes slideUp { to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .mobile-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 90; display: none; opacity: 0; transition: 0.3s; backdrop-filter: blur(4px); }
        .mobile-overlay.active { display: block; opacity: 1; }
        .ai-thinking { display: flex; gap: 4px; align-items: center; height: 24px; }
        .ai-thinking span { width: 6px; height: 6px; border-radius: 50%; background-color: var(--primary); animation: bounce 1.4s infinite ease-in-out both; box-shadow: 0 0 5px var(--primary); }
        .ai-thinking span:nth-child(1) { animation-delay: -0.32s; }
        .ai-thinking span:nth-child(2) { animation-delay: -0.16s; }
        @keyframes bounce { 0%, 80%, 100% { transform: scale(0); opacity: 0.3; } 40% { transform: scale(1); opacity: 1; } }
    </style>
</head>
<body>

    <div class="modal-overlay" id="customModal">
        <div class="modal-box">
            <h3 id="modalTitle">Titolo</h3>
            <p id="modalDesc" style="display:none;"></p>
            <input type="text" id="modalInput" style="display:none;" placeholder="Nuovo nome chat..." />
            <div class="modal-actions">
                <button class="modal-btn cancel" onclick="closeModal()">Annulla</button>
                <button class="modal-btn confirm" id="modalConfirmBtn">Conferma</button>
            </div>
        </div>
    </div>

    <div class="mobile-overlay" id="mobileOverlay"></div>

    <aside class="sidebar" id="sidebar">
        <div class="sidebar-top-actions">
            <button class="new-chat-btn" onclick="resetChat(false)">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"></path></svg>
                Nuova Chat
            </button>
            <button class="temp-chat-btn" id="tempChatBtn" onclick="resetChat(true)" title="Chat Temporanea">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" stroke-dasharray="4 4"></path>
                </svg>
            </button>
        </div>

        <div class="history-title">Chat Recenti</div>
        <div class="history-list" id="historyList">
        </div>
    </aside>

    <main class="main-content">
        <header class="header">
            <div class="header-content">
                <button class="menu-btn" id="menuBtn">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
                </button>
                <div class="brand-container">
                    <div class="brand-icon">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .963 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.581a.5.5 0 0 1 0 .964L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.963 0z"></path></svg>
                    </div>
                    <div class="brand">Peppe <span>AI</span></div>
                </div>
            </div>
            
            <div class="header-actions">
                <div class="temp-badge" id="tempBadge" style="display: none;">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" stroke-dasharray="4 4"></path>
                    </svg>
                    Temporanea
                </div>
            </div>
        </header>

        <div class="chat-container" id="chatContainer">
            <div class="welcome-screen" id="welcomeScreen">
                <h1>Ciao, sono <span>Peppe AI</span></h1>
                <p style="color: var(--text-200);" id="welcomeDesc">L'intelligenza definitiva per il tuo business.</p>
                <div class="suggestions">
                    <div class="suggestion-chip" onclick="fillInput('Riassumi questo documento')"> Riassumi Testo</div>
                    <div class="suggestion-chip" onclick="fillInput('Scrivi un post LinkedIn')"> Scrivi Post</div>
                    <div class="suggestion-chip" onclick="fillInput('Aiutami a fare debug')"> Debug Codice</div>
                </div>
            </div>
        </div>

        <div class="input-area">
            <div class="input-wrapper-outer">
                <div class="input-wrapper">
                    <button class="icon-btn" title="Allega file" onclick="document.getElementById('fileInput').click()">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path></svg>
                    </button>
                    <input type="file" id="fileInput" hidden multiple accept="image/*,.pdf,.doc,.txt,.csv">

                    <textarea id="userInput" placeholder="Scrivi qualcosa..." rows="1"></textarea>
                    
                    <button class="icon-btn" id="micBtn" title="Dettatura vocale">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"></path>
                            <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
                            <line x1="12" y1="19" x2="12" y2="22"></line>
                        </svg>
                    </button>

                    <button class="send-btn" id="sendBtn" disabled>
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="12" y1="19" x2="12" y2="5"></line>
                            <polyline points="5 12 12 5 19 12"></polyline>
                        </svg>
                    </button>
                </div>
            </div>
        </div>
    </main>

    <script>
        const chatContainer = document.getElementById('chatContainer');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const welcomeScreen = document.getElementById('welcomeScreen');
        const sidebar = document.getElementById('sidebar');
        const mobileOverlay = document.getElementById('mobileOverlay');
        const historyList = document.getElementById('historyList');
        const micBtn = document.getElementById('micBtn');
        const tempChatBtn = document.getElementById('tempChatBtn');
        const tempBadge = document.getElementById('tempBadge');

        let isFirstMessageOfChat = true; 
        let isTempMode = false;
        let currentChatId = null; 
        
        let savedChats = JSON.parse(localStorage.getItem('peppeChats')) || [];

        function renderHistory() {
            historyList.innerHTML = '';
            if(savedChats.length === 0) {
                historyList.innerHTML = '<div class="empty-history">Nessuna chat recente.<br>Scrivi un messaggio.</div>';
                return;
            }

            savedChats.forEach(chat => {
                const item = document.createElement('div');
                item.className = 'history-item';
                // Assicuriamoci che l'id sia letto come stringa nella renderizzazione per passarlo alla funzione openModal
                item.innerHTML = `
                    <div class="history-item-content">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg> 
                        <span>${chat.title}</span>
                    </div>
                    <div class="history-actions">
                        <button class="action-btn" onclick="openModal('rename', ${chat.id}, '${chat.title.replace(/'/g, "\\'")}', event)" title="Rinomina">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"></path><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path></svg>
                        </button>
                        <button class="action-btn delete" onclick="openModal('delete', ${chat.id}, '', event)" title="Elimina">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                        </button>
                    </div>
                `;
                historyList.appendChild(item);
            });
            if(!isFirstMessageOfChat && historyList.firstChild && !isTempMode) {
                historyList.firstChild.classList.add('active');
            }
        }

        renderHistory();

        // --- GESTIONE MODALS POPUP ---
        let modalActionType = '';
        let modalTargetId = null;
        const customModal = document.getElementById('customModal');
        const modalInput = document.getElementById('modalInput');
        const modalDesc = document.getElementById('modalDesc');

        function openModal(action, id, titleStr, event) {
            event.stopPropagation();
            modalActionType = action;
            modalTargetId = Number(id); // Assicura che l'ID sia trattato come numero
            
            document.getElementById('modalTitle').innerText = action === 'rename' ? 'Rinomina Chat' : 'Elimina Chat';
            const btn = document.getElementById('modalConfirmBtn');
            
            if(action === 'rename') {
                modalInput.style.display = 'block';
                modalDesc.style.display = 'none';
                modalInput.value = titleStr;
                btn.innerText = 'Salva';
                btn.style.backgroundColor = 'var(--primary)';
            } else {
                modalInput.style.display = 'none';
                modalDesc.style.display = 'block';
                modalDesc.innerText = "Sei sicuro di voler eliminare definitivamente questa chat? L'azione è irreversibile.";
                btn.innerText = 'Elimina';
                btn.style.backgroundColor = '#ef4444';
            }
            
            customModal.classList.add('active');
            if(action === 'rename') modalInput.focus();
        }

        function closeModal() {
            customModal.classList.remove('active');
            modalInput.value = '';
        }

        document.getElementById('modalConfirmBtn').addEventListener('click', () => {
            if(modalActionType === 'rename') {
                const newTitle = modalInput.value.trim();
                if(newTitle) {
                    const idx = savedChats.findIndex(c => c.id === modalTargetId);
                    if(idx !== -1) savedChats[idx].title = newTitle;
                }
            } else if (modalActionType === 'delete') {
                // Filtriamo e rimuoviamo l'id specificato
                savedChats = savedChats.filter(c => c.id !== modalTargetId);
                
                // Se stiamo eliminando proprio la chat che stiamo visualizzando, resettiamo la schermata
                if (currentChatId === modalTargetId) {
                    resetChat(false); 
                }
            }
            localStorage.setItem('peppeChats', JSON.stringify(savedChats));
            renderHistory();
            closeModal();
        });

        // Toggle Sidebar
        document.getElementById('menuBtn').addEventListener('click', () => {
            if (window.innerWidth <= 768) { sidebar.classList.toggle('active'); mobileOverlay.classList.toggle('active'); } 
            else { sidebar.classList.toggle('collapsed'); }
        });
        mobileOverlay.addEventListener('click', () => { sidebar.classList.remove('active'); mobileOverlay.classList.remove('active'); });

        // Check Input
        function checkInputState() {
            sendBtn.disabled = !(userInput.value.trim().length > 0);
        }
        userInput.addEventListener('input', function() { this.style.height = 'auto'; this.style.height = (this.scrollHeight) + 'px'; checkInputState(); });
        function fillInput(text) { userInput.value = text; userInput.dispatchEvent(new Event('input')); userInput.focus(); }

        // --- GESTIONE MICROFONO ---
        let recognition;
        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRec();
            recognition.lang = 'it-IT';
            recognition.interimResults = false;
            recognition.maxAlternatives = 1;

            recognition.onstart = function() {
                micBtn.classList.add('mic-active');
            };
            recognition.onresult = function(event) {
                const speechResult = event.results[0][0].transcript;
                userInput.value += (userInput.value ? ' ' : '') + speechResult;
                userInput.dispatchEvent(new Event('input')); 
                checkInputState();
            };
            recognition.onerror = function(event) {
                console.error('Errore riconoscimento vocale:', event.error);
                micBtn.classList.remove('mic-active');
            };
            recognition.onend = function() {
                micBtn.classList.remove('mic-active');
            };
        }

        micBtn.addEventListener('click', () => {
            if (recognition) {
                if (micBtn.classList.contains('mic-active')) {
                    recognition.stop();
                } else {
                    recognition.start();
                }
            } else {
                alert('Il riconoscimento vocale non è supportato dal tuo browser.');
            }
        });

        // Gestione Invio Messaggio
        function addMessage(text, sender) {
            if (welcomeScreen) welcomeScreen.style.display = 'none';
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${sender}`;
            
            const avatarHtml = sender === 'ai' 
                ? '<div class="avatar"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .963 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.581a.5.5 0 0 1 0 .964L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.963 0z"></path></svg></div>' 
                : '<div class="avatar">U</div>';
            
            msgDiv.innerHTML = `${avatarHtml}<div class="message-content">${text.replace(/\n/g, '<br>')}</div>`;
            chatContainer.appendChild(msgDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function handleSend() {
            const text = userInput.value.trim();
            if (!text) return;

            // Crea nuova chat nello storico (se non temporanea e se è il primo msg)
            if (isFirstMessageOfChat && text && !isTempMode) {
                currentChatId = Date.now();
                let title = text.substring(0, 25);
                if(text.length > 25) title += "...";
                savedChats.unshift({ id: currentChatId, title: title });
                localStorage.setItem('peppeChats', JSON.stringify(savedChats));
                renderHistory();
            }
            isFirstMessageOfChat = false;

            userInput.value = ''; userInput.style.height = 'auto'; checkInputState();
            addMessage(text, 'user');

            // Simula AI
            const thinkingDiv = document.createElement('div');
            thinkingDiv.className = 'message ai';
            thinkingDiv.innerHTML = '<div class="avatar"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .963 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.581a.5.5 0 0 1 0 .964L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.963 0z"></path></svg></div><div class="message-content"><div class="ai-thinking"><span></span><span></span><span></span></div></div>';
            chatContainer.appendChild(thinkingDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;

            setTimeout(() => {
                thinkingDiv.remove();
                addMessage("Sono Peppe AI e sono pronto ad aiutarti.", 'ai');
            }, 1500);
        }

        // Reset Chat / Chat Temporanea
        function resetChat(isTemp = false) {
            isTempMode = isTemp;
            currentChatId = null; // Resettiamo l'ID corrente
            chatContainer.innerHTML = '';
            
            if(isTemp) {
                tempChatBtn.classList.add('active');
                tempBadge.style.display = 'flex'; // Mostra il badge in alto a destra
                document.getElementById('welcomeDesc').innerHTML = '<span style="color:#ef4444; font-weight:bold;">Modalità Temporanea Attiva.</span><br>La chat non verrà salvata nello storico.';
            } else {
                tempChatBtn.classList.remove('active');
                tempBadge.style.display = 'none'; // Nasconde il badge
                document.getElementById('welcomeDesc').innerText = "L'intelligenza definitiva per il tuo business.";
            }

            welcomeScreen.style.display = 'flex';
            chatContainer.appendChild(welcomeScreen);
            userInput.value = ''; userInput.style.height = 'auto'; userInput.focus();
            isFirstMessageOfChat = true; 
            
            const items = historyList.querySelectorAll('.history-item');
            items.forEach(i => i.classList.remove('active'));
            if (window.innerWidth <= 768) { sidebar.classList.remove('active'); mobileOverlay.classList.remove('active'); }
        }

        sendBtn.addEventListener('click', handleSend);
        userInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); if (!sendBtn.disabled) handleSend(); }
        });
    </script>
</body>
</html>
